<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="100%" height="100%">
  <defs>
    <filter id="neon-glow-scale" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neon-glow-scale)" stroke="#55F7A5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Height Meter Stand on the right -->
    <rect x="235" y="60" width="38" height="280" rx="4" stroke-width="2.5" />
    <!-- Height Meter markings -->
    <line x1="240" y1="80" x2="252" y2="80" stroke-width="2"/>
    <line x1="240" y1="100" x2="260" y2="100" stroke-width="2.5"/>
    <line x1="240" y1="120" x2="252" y2="120" stroke-width="2"/>
    <line x1="240" y1="140" x2="260" y2="140" stroke-width="2.5"/>
    <line x1="240" y1="160" x2="252" y2="160" stroke-width="2"/>
    <line x1="240" y1="180" x2="260" y2="180" stroke-width="2.5"/>
    <line x1="240" y1="200" x2="252" y2="200" stroke-width="2"/>
    <line x1="240" y1="220" x2="260" y2="220" stroke-width="2.5"/>
    <line x1="240" y1="240" x2="252" y2="240" stroke-width="2"/>
    <line x1="240" y1="260" x2="260" y2="260" stroke-width="2.5"/>
    <line x1="240" y1="280" x2="252" y2="280" stroke-width="2"/>
    <line x1="240" y1="300" x2="260" y2="300" stroke-width="2.5"/>
    
    <!-- Measuring sliding headpiece -->
    <path d="M210 110 L235 110 L235 130 L210 130 Z" stroke-width="2" />

    <!-- Round scale platform at bottom -->
    <ellipse cx="170" cy="350" rx="85" ry="24" stroke-width="3.5" />
    <ellipse cx="170" cy="354" rx="75" ry="18" stroke-width="2" opacity="0.5"/>
    <!-- Scale Digital Display -->
    <rect x="145" y="348" width="50" height="15" rx="3" fill="#07100D" stroke-width="1.5"/>
    <text x="170" y="359" fill="#55F7A5" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">103.0 kg</text>

    <!-- Round Cat Body -->
    <!-- Ears -->
    <path d="M140 145 L130 110 L155 125" />
    <path d="M195 145 L205 110 L180 125" />
    <path d="M155 125 C165 122, 170 122, 180 125" />

    <!-- Chubby Head & Round Belly in one contour -->
    <path d="M135 150 C110 170, 100 230, 115 285 C125 320, 145 338, 170 338 C195 338, 215 320, 225 285 C240 230, 230 170, 205 150 C185 140, 155 140, 135 150 Z" stroke-width="3" />

    <!-- Cat Stripes -->
    <path d="M107 230 Q120 233 125 235" stroke-width="2.5"/>
    <path d="M104 250 Q118 253 126 256" stroke-width="2.5"/>
    <path d="M233 230 Q220 233 215 235" stroke-width="2.5"/>
    <path d="M236 250 Q222 253 214 256" stroke-width="2.5"/>

    <!-- Grumpy/Determined Cat Face -->
    <!-- Eyes -->
    <path d="M145 165 L160 162" stroke-width="2.5" />
    <circle cx="153" cy="167" r="2.5" fill="#55F7A5" />
    <path d="M195 165 L180 162" stroke-width="2.5" />
    <circle cx="187" cy="167" r="2.5" fill="#55F7A5" />

    <!-- Nose & Mouth -->
    <polygon points="170,172 166,176 174,176" fill="#55F7A5" />
    <path d="M170 176 L170 182" stroke-width="2" />
    <path d="M170 182 Q164 184 160 181" stroke-width="2" />
    <path d="M170 182 Q176 184 180 181" stroke-width="2" />

    <!-- Whiskers -->
    <line x1="138" y1="175" x2="118" y2="173" stroke-width="1.8" />
    <line x1="137" y1="181" x2="116" y2="183" stroke-width="1.8" />
    <line x1="202" y1="175" x2="222" y2="173" stroke-width="1.8" />
    <line x1="203" y1="181" x2="224" y2="183" stroke-width="1.8" />

    <!-- Tiny front paws -->
    <ellipse cx="150" cy="245" rx="7" ry="14" stroke-width="2.5"/>
    <ellipse cx="190" cy="245" rx="7" ry="14" stroke-width="2.5"/>

    <!-- Tail curling up -->
    <path d="M225 285 C245 280, 252 300, 248 318 C245 328, 235 330, 226 325" stroke-width="2.5" />

    <!-- Feet on scale -->
    <ellipse cx="148" cy="336" rx="10" ry="5" fill="#07100D" stroke-width="2" />
    <ellipse cx="192" cy="336" rx="10" ry="5" fill="#07100D" stroke-width="2" />
  </g>
</svg>
