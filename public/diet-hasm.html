<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="خطة تغذية حسم" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.shopify.com/s/files/1/0739/2205/2198/files/workout-neon-180.png?v=1788806135" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://cdn.shopify.com/s/files/1/0739/2205/2198/files/workout-neon-180.png?v=1788806135" />
    <title>خطة تغذية حسم</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020b08;
        color: #e8fff4;
        font-family: Arial, Tahoma, sans-serif;
      }

      a { color: #6ee7b7; }
    </style>
  </head>
  <body>
    <p id="dietHasmLoading">جاري تحميل خطة تغذية حسم…</p>
    <script>
      (async () => {
        const pageUrl = new URL(location.href);
        pageUrl.searchParams.set("book", "hasmDiet");
        history.replaceState(null, "", pageUrl);

        try {
          const response = await fetch("./manga-viewer.html");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const viewerHtml = await response.text();
          document.open();
          document.write(viewerHtml);
          document.close();
        } catch (error) {
          const loading = document.getElementById("dietHasmLoading");
          if (loading) {
            loading.innerHTML = 'تعذر تحميل الصفحة. <a href="./manga-viewer.html?book=hasmDiet">فتح خطة تغذية حسم</a>';
          }
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
