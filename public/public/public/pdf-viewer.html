<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manga PDF Viewer</title>

<style>
body{margin:0;background:#121619;color:#fff;font-family:Arial}
.top{
  position:sticky;top:0;z-index:10;
  background:#121619;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.1)
}
button,a{
  background:none;border:0;color:#ff66c4;
  font-weight:700;font-size:16px;cursor:pointer;text-decoration:none
}
#pages{
  max-width:1100px;
  margin:0 auto;
  padding:24px 12px 60px;
}
.page{
  margin-bottom:20px;
  background:#1c1f22;
  border-radius:14px;
  padding:10px;
}
canvas{width:100%;height:auto;border-radius:10px}
</style>
</head>

<body>

<div class="top">
  <button onclick="history.back()">← Back</button>
  <a id="dl" href="#" target="_blank">Download</a>
</div>

<div id="pages">Loading…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js";

const file = new URLSearchParams(location.search).get("file");
const pagesDiv = document.getElementById("pages");
document.getElementById("dl").href = file;

(async()=>{
  const pdf = await pdfjsLib.getDocument(file).promise;
  pagesDiv.innerHTML = "";

  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale:1});
    const scale = (pagesDiv.clientWidth-20)/viewport.width;
    const v = page.getViewport({scale});

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = v.width;
    canvas.height = v.height;

    await page.render({canvasContext:ctx,viewport:v}).promise;

    const box = document.createElement("div");
    box.className="page";
    box.appendChild(canvas);
    pagesDiv.appendChild(box);
  }
})();
</script>

</body>
</html>
