<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON COACH — تمرين الـ 40 يوم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./styles/library.css" />

    <style>
      html,
      body {
        max-width: 100%;
        overflow-x: hidden;
        overscroll-behavior-x: none;
      }

      body {
        position: relative;
      }

      .viewer-wrap,
      .top-nav,
      .nav-tabs,
      .library-card,
      .library-section,
      .pages,
      .page,
      .page-with-tracker,
      .tracker-box {
        max-width: 100%;
        min-width: 0;
      }

      .viewer-wrap {
        width: 100%;
        overflow-x: clip;
      }

      .page,
      .page-with-tracker {
        overflow-x: hidden;
      }

      .page img {
        max-width: 100%;
      }

      .page-with-tracker {
        display: grid;
        gap: 14px;
        margin-bottom: 28px;
      }

      .tracker-box {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 16px;
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .sets-table {
        display: grid;
        gap: 10px;
      }

      .sets-head,
      .set-row {
        display: grid;
        grid-template-columns: 42px 1fr 1fr 42px;
        gap: 8px;
        align-items: center;
      }

      .sets-head {
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        font-weight: 700;
        padding: 0 2px;
      }

      .set-number,
      .set-input,
      .done-btn {
        min-height: 46px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.08);
      }

      .set-number {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 14px;
        font-weight: 800;
      }

      .set-input {
        width: 100%;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        outline: none;
        font-family: inherit;
        padding: 0 8px;
        appearance: textfield;
        -moz-appearance: textfield;
        touch-action: manipulation;
      }

      .set-input::-webkit-outer-spin-button,
      .set-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .done-btn {
        border: none;
        cursor: pointer;
        font-size: 20px;
        font-weight: 800;
        color: #fff;
        transition: 0.18s ease;
      }

      .done-btn.active {
        background: rgba(57, 217, 138, 0.16);
        color: #39d98a;
        border-color: rgba(57, 217, 138, 0.55);
      }

      .tracker-actions {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .tracker-btn {
        width: 100%;
        min-height: 48px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
      }

      .tracker-btn.primary {
        background: #7c4dff;
        border-color: transparent;
      }

      .vitality-theme .tracker-box {
        background: rgba(255, 255, 255, 0.02);
        border-color: rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        backdrop-filter: blur(20px) saturate(1.2);
        -webkit-backdrop-filter: blur(20px) saturate(1.2);
      }

      .vitality-theme .tracker-btn {
        border-radius: 999px;
        background: rgba(110, 231, 183, 0.04);
        border-color: rgba(110, 231, 183, 0.25);
        color: #6ee7b7;
        box-shadow: 0 0 16px rgba(110, 231, 183, 0.1);
      }

      .vitality-theme .tracker-btn.primary {
        background: #6ee7b7;
        border-color: #6ee7b7;
        color: #042a1c;
      }

      .workout-exercises {
        display: none !important;
      }

      body.workout-view .workout-exercises,
      body.ppl-view .workout-exercises {
        display: block !important;
      }

      .hasm-session-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
        padding: 18px 20px;
        border: 1px solid rgba(110, 231, 183, 0.2);
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(110, 231, 183, 0.1), rgba(1, 12, 8, 0.8));
      }

      .hasm-session-bar[hidden],
      .hasm-finish-wrap[hidden] {
        display: none !important;
      }

      .hasm-session-bar > div {
        display: grid;
        gap: 3px;
      }

      .hasm-session-bar small {
        color: rgba(110, 231, 183, 0.7);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.18em;
      }

      .hasm-session-bar strong {
        color: #f2fff9;
        font-family: "JetBrains Mono", monospace;
        font-size: 25px;
        line-height: 1.1;
      }

      .hasm-session-bar span {
        color: rgba(255, 255, 255, 0.58);
        font-size: 12px;
      }

      .hasm-start-btn,
      .hasm-finish-btn {
        border: 0;
        border-radius: 999px;
        background: #6ee7b7;
        color: #042a1c;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        font-weight: 900;
        padding: 13px 20px;
        box-shadow: 0 0 24px rgba(110, 231, 183, 0.18);
      }

      .hasm-start-btn.is-running {
        border: 1px solid rgba(110, 231, 183, 0.28);
        background: rgba(110, 231, 183, 0.08);
        color: #6ee7b7;
        cursor: default;
      }

      .hasm-finish-wrap {
        display: grid;
        gap: 8px;
        margin-top: 26px;
        text-align: center;
      }

      .hasm-finish-btn {
        width: 100%;
        min-height: 54px;
        background: linear-gradient(135deg, #6ee7b7, #34d399);
        font-size: 16px;
      }

      .hasm-finish-btn:disabled {
        opacity: 0.38;
        cursor: not-allowed;
        box-shadow: none;
      }

      .hasm-finish-wrap small {
        color: rgba(255, 255, 255, 0.46);
      }

      body.hasm-view .exercise-workout-card.is-completed .exercise-log-box {
        border-color: rgba(74, 222, 128, 0.72);
        background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(2, 40, 24, 0.92));
        box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.12), 0 20px 55px rgba(34, 197, 94, 0.18);
      }

      body.hasm-view .exercise-workout-card.is-completed .exercise-log-row {
        border-color: rgba(74, 222, 128, 0.22);
        background: rgba(34, 197, 94, 0.09);
      }

      body.hasm-view .exercise-log-row {
        grid-template-columns: 42px minmax(110px, 1fr) auto minmax(110px, 1fr) 48px;
      }

      body.hasm-view .exercise-log-row.is-set-done {
        border-color: rgba(74, 222, 128, 0.42);
        background: rgba(34, 197, 94, 0.16);
      }

      body.hasm-view .exercise-log-row.is-set-done .set-number,
      body.hasm-view .exercise-log-row.is-set-done .set-input,
      body.hasm-view .exercise-log-row.is-set-done .log-input-group span {
        color: #dfffea;
        opacity: 1;
      }

      .hasm-set-done-btn {
        width: 46px;
        min-height: 46px;
        border: 1px solid rgba(74, 222, 128, 0.5);
        border-radius: 14px;
        background: rgba(34, 197, 94, 0.1);
        color: #86efac;
        cursor: pointer;
        font-family: inherit;
        font-size: 25px;
        font-weight: 900;
        transition: 0.18s ease;
      }

      .hasm-set-done-btn:hover:not(:disabled) {
        transform: scale(1.05);
        background: rgba(34, 197, 94, 0.2);
        box-shadow: 0 0 22px rgba(74, 222, 128, 0.24);
      }

      .hasm-set-done-btn.is-done {
        background: #4ade80;
        color: #032414;
        box-shadow: 0 0 26px rgba(74, 222, 128, 0.35);
      }

      .hasm-set-done-btn:disabled:not(.is-done) {
        opacity: 0.35;
        cursor: not-allowed;
      }

      body.hasm-view .exercise-workout-card.is-completed input,
      body.hasm-view .exercise-workout-card.is-completed [data-role="exercise-add-set"],
      body.hasm-view .exercise-workout-card.is-completed [data-role="exercise-reset-tracker"],
      body.hasm-view .exercise-workout-card.is-completed [data-role="exercise-tune"] {
        opacity: 0.62;
        pointer-events: none;
      }

      .workout-summary-modal {
        position: fixed;
        inset: 0;
        z-index: 140;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(0, 8, 5, 0.88);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .workout-summary-modal.is-open {
        opacity: 1;
        pointer-events: auto;
      }

      .workout-summary-sheet {
        position: relative;
        width: min(100%, 620px);
        max-height: 94vh;
        overflow: auto;
        padding: 24px;
        border: 1px solid rgba(110, 231, 183, 0.24);
        border-radius: 24px;
        background:
          radial-gradient(circle at 50% 0%, rgba(110, 231, 183, 0.14), transparent 34%),
          #020b08;
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.72);
        color: #f2fff9;
      }

      .summary-top-actions {
        display: flex;
        justify-content: space-between;
        direction: ltr;
      }

      .summary-top-actions button {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(110, 231, 183, 0.2);
        border-radius: 14px;
        background: rgba(110, 231, 183, 0.07);
        color: #dfffee;
        cursor: pointer;
        font-size: 25px;
      }

      .summary-stars {
        margin: 8px 0 4px;
        color: #6ee7b7;
        font-size: 42px;
        letter-spacing: 10px;
        text-align: center;
        text-shadow: 0 0 28px rgba(110, 231, 183, 0.4);
      }

      .summary-hero {
        text-align: center;
      }

      .summary-hero h2 {
        margin: 0;
        color: #f4fff9;
        font-size: clamp(30px, 6vw, 48px);
      }

      .summary-hero p {
        margin: 8px 0 22px;
        color: rgba(255, 255, 255, 0.58);
        font-size: 16px;
      }

      .summary-card {
        padding: 18px;
        border: 1px solid rgba(110, 231, 183, 0.16);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.025);
      }

      .summary-card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .summary-card-head strong {
        color: #eafff4;
      }

      .summary-card-head span {
        color: rgba(255, 255, 255, 0.52);
        font-size: 13px;
      }

      .summary-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 18px;
      }

      .summary-stat {
        display: grid;
        gap: 3px;
        padding: 11px 8px;
        border-radius: 12px;
        background: rgba(110, 231, 183, 0.055);
        text-align: center;
      }

      .summary-stat b {
        color: #6ee7b7;
        font-size: 16px;
      }

      .summary-stat small {
        color: rgba(255, 255, 255, 0.48);
        font-size: 10px;
        text-transform: uppercase;
      }

      .summary-exercise-head,
      .summary-exercise-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
      }

      .summary-exercise-head {
        padding-bottom: 8px;
        color: rgba(255, 255, 255, 0.44);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .summary-exercise-row {
        padding: 11px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
      }

      .summary-exercise-row b {
        overflow: hidden;
        color: #eafff4;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .summary-exercise-row span {
        color: #6ee7b7;
        direction: ltr;
        font-family: "JetBrains Mono", monospace;
        white-space: nowrap;
      }

      .summary-empty {
        padding: 24px 12px;
        color: rgba(255, 255, 255, 0.55);
        text-align: center;
      }

      @media (max-width: 640px) {
        .viewer-wrap {
          padding: 14px 10px 48px;
          gap: 14px;
          overflow-x: hidden;
        }

        .top-nav,
        .library-card,
        .library-section,
        .page,
        .tracker-box {
          box-shadow: none;
        }

        .nav-tabs {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 5px;
          width: 100%;
        }

        .nav-tab {
          min-width: 0;
          padding: 8px 5px;
          white-space: normal;
          text-align: center;
          font-size: 12px;
          line-height: 1.25;
        }

        .viewer-topbar {
          padding: 10px;
        }

        .viewer-actions {
          width: 100%;
          min-width: 0;
        }

        .viewer-title {
          flex: 1;
          min-width: 0;
          max-width: none;
          white-space: normal;
          line-height: 1.35;
        }

        .btn-back {
          flex: 0 0 auto;
          padding: 10px 12px;
          font-size: 12px;
        }

        .vitality-theme .library-section {
          padding: 14px 10px;
        }

        .vitality-theme .section-head h2 {
          font-size: 26px;
        }

        .muscle-filter,
        .muscle-filter.ppl-filter {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
          overflow: visible;
        }

        .muscle-filter.ppl-filter {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .muscle-btn {
          min-width: 0;
          padding-inline: 8px;
          font-size: 12px;
          white-space: normal;
        }

        .exercise-log-box {
          border-radius: 14px;
        }

        body.workout-view .exercise-log-heading {
          grid-template-columns: auto minmax(0, 1fr) auto;
          gap: 8px;
        }

        body.workout-view .exercise-log-heading h3 {
          min-width: 0;
          font-size: 17px;
          line-height: 1.25;
        }

        body.workout-view .exercise-log-actions {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }

        .log-pill {
          width: 100%;
          min-height: 40px;
          padding-inline: 10px;
          font-size: 12px;
        }

        body.workout-view .exercise-log-row {
          grid-template-columns: 26px minmax(0, 1fr) 12px minmax(0, 1fr);
          gap: 5px;
          min-height: 58px;
          padding: 8px;
          border-radius: 12px;
        }

        body.workout-view .exercise-log-row .set-number {
          font-size: 14px;
        }

        .log-input-group {
          grid-template-columns: minmax(0, 1fr) 24px;
          gap: 3px;
        }

        .log-input-group .set-input {
          min-height: 38px;
          font-size: 18px;
        }

        .log-input-group span {
          font-size: 10px;
        }

        .log-multiply {
          text-align: center;
          font-size: 12px;
        }

        body.workout-view .exercise-log-box .tracker-actions {
          grid-template-columns: 1fr;
          padding-inline: 10px;
        }

        body.hasm-view .exercise-log-row {
          grid-template-columns: 26px minmax(0, 1fr) 12px minmax(0, 1fr) 38px;
        }

        body.hasm-view .hasm-set-done-btn {
          width: 38px;
          min-height: 38px;
          border-radius: 11px;
          font-size: 20px;
        }

        .sets-head,
        .set-row {
          grid-template-columns: 36px 1fr 1fr 38px;
          gap: 6px;
        }

        .set-number {
          font-size: 13px;
        }

        .set-input {
          font-size: 16px;
        }

        .scroll-top-btn {
          right: 12px;
          bottom: 12px;
        }

        .exercise-modal,
        .exercise-image-modal {
          padding: 8px;
        }

        body.workout-view .exercise-modal-sheet {
          width: 100%;
          max-height: calc(100vh - 16px);
          padding: 18px 14px;
          border-radius: 16px;
        }

        body.hasm-view .exercise-modal-sheet {
          width: 90%;
          max-height: 90vh;
        }

        body.hasm-view .exercise-modal-sheet.is-tune-modal {
          overflow-x: hidden;
          padding: 18px 14px 16px;
        }

        body.hasm-view .is-tune-modal .modal-title {
          overflow-wrap: anywhere;
        }

        body.hasm-view .is-tune-modal .tune-panel,
        body.hasm-view .is-tune-modal .tune-row,
        body.hasm-view .is-tune-modal .tune-control {
          min-width: 0;
          max-width: 100%;
        }

        body.hasm-view .is-tune-modal .tune-row {
          min-height: 66px;
          gap: 8px;
          letter-spacing: 0.1em;
        }

        body.hasm-view .is-tune-modal .tune-row > span:first-child {
          flex: 0 0 62px;
        }

        body.hasm-view .is-tune-modal .tune-control {
          flex: 1 1 auto;
          justify-content: flex-end;
          gap: 6px;
        }

        body.hasm-view .is-tune-modal .tune-control button {
          flex: 0 0 40px;
          width: 40px;
          height: 40px;
          border: 1px solid rgba(110, 231, 183, 0.2);
          border-radius: 50%;
          background: rgba(110, 231, 183, 0.06);
          font-size: 24px;
        }

        body.hasm-view .is-tune-modal .tune-input {
          width: 90px;
          min-width: 0;
          max-width: 100%;
          font-size: 27px;
        }

        body.hasm-view .is-tune-modal .tune-input.compact {
          width: 58px;
        }

        body.hasm-view .is-tune-modal .modal-actions {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          margin-top: 18px;
        }

        body.hasm-view .is-tune-modal .modal-actions button {
          width: 100%;
          min-width: 0;
          min-height: 44px;
        }

        .hasm-session-bar {
          align-items: stretch;
          padding: 14px;
        }

        .hasm-session-bar strong {
          font-size: 21px;
        }

        .hasm-start-btn {
          align-self: center;
          padding-inline: 14px;
          white-space: nowrap;
        }

        .workout-summary-modal {
          padding: 8px;
        }

        .workout-summary-sheet {
          width: 100%;
          max-height: calc(100vh - 16px);
          padding: 16px 12px;
          border-radius: 18px;
        }

        .summary-stars {
          font-size: 34px;
        }

        .summary-hero h2 {
          font-size: 31px;
        }

        .summary-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .summary-card {
          padding: 14px 11px;
        }

        .modal-title {
          margin-inline-end: 30px;
          font-size: 22px;
          line-height: 1.2;
        }

        body.workout-view .history-ranges {
          width: 100%;
          display: grid;
          grid-template-columns: repeat(6, minmax(0, 1fr));
          gap: 3px;
        }

        body.workout-view .history-ranges button {
          min-width: 0;
          padding-inline: 4px;
        }

        body.workout-view .history-graph {
          padding: 14px 12px;
        }

      body.workout-view .history-summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }

        body.workout-view .history-head,
        body.workout-view .history-row {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 6px;
          font-size: 11px;
        }
      }

      @media (max-width: 380px) {
        .viewer-wrap {
          padding-inline: 8px;
        }

        .nav-tab {
          font-size: 11px;
        }

        .muscle-filter.ppl-filter {
          grid-template-columns: 1fr;
        }

        body.workout-view .exercise-log-row {
          grid-template-columns: 24px minmax(0, 1fr) 10px minmax(0, 1fr);
          padding: 7px 6px;
        }

        body.hasm-view .exercise-log-row {
          grid-template-columns: 24px minmax(0, 1fr) 10px minmax(0, 1fr) 36px;
        }

        .set-input {
          padding-inline: 4px;
        }

        .log-input-group .set-input {
          font-size: 16px;
        }
      }
    </style>

    <style id="neon-splash-styles">
      #neon-app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        color: #FFFFFF;
        overflow: hidden;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
      }

      #neon-app-splash.splash-hide {
        opacity: 0;
        pointer-events: none;
        transform: scale(1.04);
        filter: blur(5px);
      }

      #neon-app-splash .wb-atmosphere {
        position: absolute;
        inset: 0;
        background:

      function renderExercises(muscleKey) {
        if (!exerciseContainer) return;

        activeMuscle = muscleKey;
        EXERCISE_META.clear();
        const isPpl = bookId === "ppl";
        const isAnas = bookId === "anas";
        const isFortyDay = bookId === "fortyDay";
        const isHasm = isHasmBook;
        if ((isAnas && muscleKey === "tuesdayRest") || (isFortyDay && muscleKey === "restDay")) {
          exerciseContainer.innerHTML = `
            <article class="page-with-tracker exercise-workout-card">
              <div class="exercise-log-box">
                <h3>اليوم السابع: راحة | Rest Day</h3>
                <p>استشفاء، نوم جيد، ومشي خفيف اختياري. ارجع إلى Push A في اليوم التالي.</p>
              </div>
            </article>
          `;
          return;
        }
        const exercises = isAnas
          ? (EXERCISES_BY_ANAS_DAY[muscleKey] || [])
          : isFortyDay
          ? (EXERCISES_BY_FORTY_DAY[muscleKey] || [])
          : isPpl
          ? (EXERCISES_BY_PPL_DAY[muscleKey] || [])
          : isHasm
            ? (EXERCISES_BY_HASM_GROUP[muscleKey] || [])
            : (EXERCISES_BY_MUSCLE[muscleKey] || []);
        const groupLabel = isAnas
          ? (ANAS_DAYS[muscleKey] || "نظام أنس")
          : isFortyDay
          ? (FORTY_DAY_DAYS[muscleKey] || "تمرين الـ40 يوم")
          : isPpl
          ? (PPL_DAYS[muscleKey] || "PPL")
          : isHasm
            ? (HASM_GROUPS[muscleKey] || programTitle)
            : (MUSCLES[muscleKey] || "Exercise");
        exerciseContainer.innerHTML = exercises
          .map((exercise, exerciseIndex) => {
            const exerciseId = `${bookId}_${muscleKey}_${exerciseIndex}`;
            const isCompleted = isHasmBook && isHasmExerciseCompleted(exerciseId);
            const defaultSetCount = Number(exercise.sets) || 3;
            const tracker = loadExerciseTracker(exerciseId, defaultSetCount);
            const targetSets = tracker.targetSets || defaultSetCount;
            const targetReps = tracker.targetReps || exercise.reps || "";
            EXERCISE_META.set(exerciseId, {
              ...exercise,
              targetSets,
              targetReps,
              muscle: groupLabel
            });

            return `
              <article class="page-with-tracker exercise-workout-card ${isCompleted ? "is-completed" : ""}">
                ${renderExerciseTracker(exerciseId, tracker, targetSets, exercise, exerciseIndex, isCompleted)}
              </article>
            `;
          })
          .join("");
      }

      function readStoredJson(key, fallback) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key));
          return parsed ?? fallback;
        } catch {
          return fallback;
        }
      }

      function formatWorkoutDuration(totalSeconds) {
        const seconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainingSeconds = seconds % 60;
        return [hours, minutes, remainingSeconds].map((part) => String(part).padStart(2, "0")).join(":");
      }

      function getActiveHasmSession() {
        const session = readStoredJson(HASM_ACTIVE_SESSION_KEY, null);
        return session && Number(session.startedAt) ? session : null;
      }

      function isHasmExerciseCompleted(exerciseId) {
        const session = getActiveHasmSession();
        return Boolean(session?.completedExercises?.[exerciseId]);
      }

      function updateHasmTimer() {
        if (!hasmSessionTimer) return;
        const session = getActiveHasmSession();
        const elapsed = session ? (Date.now() - Number(session.startedAt)) / 1000 : 0;
        hasmSessionTimer.textContent = formatWorkoutDuration(elapsed);
      }

      function updateHasmSessionUI() {
        if (!isHasmBook) return;
        const session = getActiveHasmSession();

        if (hasmStartBtn) {
          hasmStartBtn.disabled = Boolean(session);
          hasmStartBtn.classList.toggle("is-running", Boolean(session));
          hasmStartBtn.textContent = session ? "Workout Running" : "Start Workout";
        }

        if (hasmFinishBtn) hasmFinishBtn.disabled = !session;
        if (hasmSessionStatus) {
          hasmSessionStatus.textContent = session ? "التمرين قيد التشغيل — سجّل جولاتك ثم اضغط Finish" : "جاهز لبدء التمرين";
        }

        if (hasmTimerInterval) {
          window.clearInterval(hasmTimerInterval);
          hasmTimerInterval = null;
        }

        updateHasmTimer();
        if (session) hasmTimerInterval = window.setInterval(updateHasmTimer, 1000);
      }

      function startHasmWorkout() {
        if (!isHasmBook || getActiveHasmSession()) return;
        localStorage.setItem(HASM_ACTIVE_SESSION_KEY, JSON.stringify({ startedAt: Date.now(), completedExercises: {}, exerciseRecords: {} }));
        updateHasmSessionUI();
        renderExercises(activeMuscle);
        hasmSessionBar?.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      function syncHasmExerciseHistory(exerciseId, tracker, session) {
        const sessionId = String(session.startedAt);
        const completedSets = tracker.sets
          .map((set, index) => ({
            setNumber: index + 1,
            kg: Number(set.kg) || 0,
            reps: Number(set.reps) || 0,
            done: Boolean(set.done)
          }))
          .filter((set) => set.done && (set.kg > 0 || set.reps > 0));
        const priorHistory = (tracker.history || []).filter((row) => String(row.hasmSessionId || "") !== sessionId);

        session.exerciseRecords = session.exerciseRecords || {};
        if (!completedSets.length) {
          delete session.exerciseRecords[exerciseId];
          tracker.history = priorHistory;
          saveExerciseTracker(exerciseId, tracker);
          localStorage.setItem(HASM_ACTIVE_SESSION_KEY, JSON.stringify(session));
          return null;
        }

        const bestSet = completedSets.reduce((best, set) => {
          if (!best || set.kg > best.kg || (set.kg === best.kg && set.reps > best.reps)) return set;
          return best;
        }, null);
        const previousBest = priorHistory.reduce((best, row) => Math.max(best, Number(row.weight) || 0), 0);
        const record = {
          isPersonalRecord: Boolean(bestSet?.kg && previousBest > 0 && bestSet.kg > previousBest),
          bestKg: bestSet?.kg || 0,
          bestReps: bestSet?.reps || 0,
          sets: completedSets.length
        };

        const savedAt = new Date();
        const setHistoryRows = completedSets.map((set) => ({
          date: savedAt.toLocaleDateString("en-GB", { day: "numeric", month: "short" }),
          isoDate: savedAt.toISOString(),
          hasmSessionId: sessionId,
          hasmSetNumber: set.setNumber,
          sets: String(set.setNumber),
          reps: set.reps || "",
          weight: set.kg || ""
        }));
        tracker.history = priorHistory.concat(setHistoryRows);
        session.exerciseRecords[exerciseId] = record;
        saveExerciseTracker(exerciseId, tracker);
        localStorage.setItem(HASM_ACTIVE_SESSION_KEY, JSON.stringify(session));
        return record;
      }

      function completeHasmExercise(exerciseId) {
        const session = getActiveHasmSession();
        const record = session?.exerciseRecords?.[exerciseId];
        if (!isHasmBook || !session || !record || isHasmExerciseCompleted(exerciseId)) return false;

        session.completedExercises = session.completedExercises || {};
        session.completedExercises[exerciseId] = { ...record, completedAt: Date.now() };
        localStorage.setItem(HASM_ACTIVE_SESSION_KEY, JSON.stringify(session));
        if (hasmSessionStatus) hasmSessionStatus.textContent = "تم تسجيل جميع جولات التمرين ✓";
        renderExercises(activeMuscle);
        return true;
      }

      function toggleHasmSetDone(exerciseId, setIndex) {
        let session = getActiveHasmSession();
        const meta = EXERCISE_META.get(exerciseId);
        if (!isHasmBook || !meta || isHasmExerciseCompleted(exerciseId)) return;

        if (!session) {
          session = { startedAt: Date.now(), completedExercises: {}, exerciseRecords: {} };
          localStorage.setItem(HASM_ACTIVE_SESSION_KEY, JSON.stringify(session));
          updateHasmSessionUI();
        }

        const tracker = loadExerciseTracker(exerciseId, meta.targetSets || meta.sets || 3);
        const set = tracker.sets[setIndex];
        if (!set) return;

        if (!set.done && !(Number(set.kg) > 0 || Number(set.reps) > 0)) {
          if (hasmSessionStatus) hasmSessionStatus.textContent = "أدخل الوزن أو التكرارات لهذه الجولة أولًا";
          return;
        }

        set.done = !set.done;
        syncHasmExerciseHistory(exerciseId, tracker, session);

        const allSetsComplete = tracker.sets.length > 0 && tracker.sets.every((item) => {
          const hasValues = Number(item.kg) > 0 || Number(item.reps) > 0;
          return hasValues && item.done;
        });

        if (allSetsComplete) {
          completeHasmExercise(exerciseId);
          return;
        }

        if (hasmSessionStatus) {
          const completedSets = tracker.sets.filter((item) => item.done).length;
          hasmSessionStatus.textContent = `تم إكمال ${completedSets} من ${tracker.sets.length} جولات`;
        }
        renderExercises(activeMuscle);
      }

      function getHasmExerciseEntries() {
        const exerciseGroups = bookId === "anas"
          ? EXERCISES_BY_ANAS_DAY
          : bookId === "fortyDay"
          ? EXERCISES_BY_FORTY_DAY
          : EXERCISES_BY_HASM_GROUP;
        return Object.entries(exerciseGroups).flatMap(([groupKey, exercises]) =>
          exercises.map((exercise, exerciseIndex) => ({
            groupKey,
            exerciseIndex,
            exerciseId: `${bookId}_${groupKey}_${exerciseIndex}`,
            exercise
          }))
        );
      }

      function collectHasmWorkoutSummary(session) {
        const finishedAt = Date.now();
        const exercises = [];
        let totalSets = 0;
        let totalReps = 0;
        let totalVolume = 0;
        let personalRecords = 0;

        getHasmExerciseEntries().forEach(({ exerciseId, exercise }) => {
          const tracker = loadExerciseTracker(exerciseId, exercise.sets || 3);
          const sessionRecord = session.exerciseRecords?.[exerciseId] || null;
          const playedSets = tracker.sets
            .map((set, index) => ({
              setNumber: index + 1,
              kg: Number(set.kg) || 0,
              reps: Number(set.reps) || 0,
              done: Boolean(set.done)
            }))
            .filter((set) => set.done && (set.kg > 0 || set.reps > 0));

          if (!playedSets.length) return;

          const bestSet = playedSets.reduce((best, set) => {
            if (!best) return set;
            if (set.kg > best.kg) return set;
            if (set.kg === best.kg && set.reps > best.reps) return set;
            return best;
          }, null);
          const previousBest = (tracker.history || []).reduce((best, row) => Math.max(best, Number(row.weight) || 0), 0);
          const isPersonalRecord = sessionRecord
            ? Boolean(sessionRecord.isPersonalRecord)
            : Boolean(bestSet?.kg && previousBest > 0 && bestSet.kg > previousBest);

          totalSets += playedSets.length;
          totalReps += playedSets.reduce((sum, set) => sum + set.reps, 0);
          totalVolume += playedSets.reduce((sum, set) => sum + set.kg * set.reps, 0);
          if (isPersonalRecord) personalRecords += 1;

          exercises.push({
            title: exercise.title,
            sets: playedSets.length,
            reps: playedSets.reduce((sum, set) => sum + set.reps, 0),
            bestKg: bestSet?.kg || 0,
            bestReps: bestSet?.reps || 0,
            volume: playedSets.reduce((sum, set) => sum + set.kg * set.reps, 0),
            isPersonalRecord
          });

          const nextHistory = Array.isArray(tracker.history) ? tracker.history.slice(-99) : [];
          if (!sessionRecord) {
            nextHistory.push({
              date: new Date(finishedAt).toLocaleDateString("en-GB", { day: "numeric", month: "short" }),
              isoDate: new Date(finishedAt).toISOString(),
              sets: playedSets.map((set) => set.setNumber).join(", "),
              reps: bestSet?.reps || "",
              weight: bestSet?.kg || ""
            });
          }
          saveExerciseTracker(exerciseId, {
            ...tracker,
            sets: createDefaultSets(tracker.targetSets || exercise.sets || 3),
            history: nextHistory
          });
        });

        const workoutHistory = readStoredJson(HASM_WORKOUT_HISTORY_KEY, []);
        const safeWorkoutHistory = Array.isArray(workoutHistory) ? workoutHistory : [];
        const summary = {
          id: `${bookId}_${finishedAt}`,
          workoutNumber: safeWorkoutHistory.length + 1,
          startedAt: Number(session.startedAt),
          finishedAt,
          durationSeconds: Math.max(1, Math.round((finishedAt - Number(session.startedAt)) / 1000)),
          dateLabel: new Intl.DateTimeFormat("ar-JO", { weekday: "long", day: "numeric", month: "short" }).format(new Date(finishedAt)),
          exercises,
          totalSets,
          totalReps,
          totalVolume: Math.round(totalVolume),
          personalRecords
        };

        safeWorkoutHistory.push(summary);
        localStorage.setItem(HASM_WORKOUT_HISTORY_KEY, JSON.stringify(safeWorkoutHistory.slice(-100)));
        return summary;
      }

      function formatBestSet(exercise) {
        if (exercise.bestKg > 0) return `${exercise.bestKg} kg × ${exercise.bestReps || "-"}`;
        return `${exercise.bestReps || exercise.reps || "-"} reps`;
      }

      function buildHasmShareText(summary) {
        const lines = summary.exercises.map((exercise) => `${exercise.sets} × ${exercise.title} — ${formatBestSet(exercise)}`);
        return [
          `تمرين ${programTitle} رقم ${summary.workoutNumber} ✅`,
          summary.dateLabel,
          `المدة: ${formatWorkoutDuration(summary.durationSeconds)}`,
          `الحجم: ${summary.totalVolume} kg · الجولات: ${summary.totalSets} · التكرارات: ${summary.totalReps}`,
          ...lines
        ].join("\n");
      }

      function showHasmWorkoutSummary(summary) {
        if (!workoutSummaryModal || !workoutSummaryContent) return;
        latestHasmSummary = summary;
        const exerciseRows = summary.exercises.length
          ? summary.exercises.map((exercise) => `
              <div class="summary-exercise-row">
                <b>${exercise.sets} × ${exercise.title}${exercise.isPersonalRecord ? " 🏆" : ""}</b>
                <span>${formatBestSet(exercise)}</span>
              </div>
            `).join("")
          : '<div class="summary-empty">لم يتم إدخال جولات في هذه الجلسة.</div>';

        workoutSummaryContent.innerHTML = `
          <div class="summary-stars">★ ★ ★</div>
          <header class="summary-hero">
            <h2>أحسنت!</h2>
            <p>أنهيت تمرين ${programTitle} رقم ${summary.workoutNumber}</p>
          </header>
          <div class="summary-card">
            <div class="summary-card-head">
              <strong>${programTitle}</strong>
              <span>${summary.dateLabel}</span>
            </div>
            <div class="summary-stats">
              <div class="summary-stat"><b>◷ ${formatWorkoutDuration(summary.durationSeconds)}</b><small>المدة</small></div>
              <div class="summary-stat"><b>${summary.totalVolume} kg</b><small>الحجم</small></div>
              <div class="summary-stat"><b>${summary.exercises.length}</b><small>التمارين</small></div>
              <div class="summary-stat"><b>${summary.totalSets}</b><small>الجولات</small></div>
              <div class="summary-stat"><b>${summary.totalReps}</b><small>التكرارات</small></div>
              <div class="summary-stat"><b>🏆 ${summary.personalRecords}</b><small>PRs</small></div>
            </div>
            <div class="summary-exercise-head"><span>التمرين</span><span>أفضل جولة</span></div>
            ${exerciseRows}
          </div>
        `;
        workoutSummaryModal.classList.add("is-open");
        workoutSummaryModal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeHasmWorkoutSummary() {
        if (!workoutSummaryModal) return;
        workoutSummaryModal.classList.remove("is-open");
        workoutSummaryModal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      function finishHasmWorkout() {
        const session = getActiveHasmSession();
        if (!isHasmBook || !session) return;
        const summary = collectHasmWorkoutSummary(session);
        localStorage.removeItem(HASM_ACTIVE_SESSION_KEY);
        updateHasmSessionUI();

      async function shareHasmWorkoutSummary() {
        if (!latestHasmSummary) return;
        const text = buildHasmShareText(latestHasmSummary);
        try {
          if (navigator.share) {
            await navigator.share({ title: `ملخص تمرين ${programTitle}`, text });
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
            if (workoutSummaryShare) workoutSummaryShare.textContent = "✓";

      function trackerEnabledForPage(currentBookId, pageIndex) {

      function createDefaultSets(count = 3) {
        return Array.from({ length: count }, () => ({ kg: "", reps: "", done: false }));

      function getStorageKey(currentBookId, pageIndex) {
        return `tracker_${currentBookId}_${pageIndex}`;

      function getExerciseStorageKey(exerciseId) {
        return `exercise_tracker_${exerciseId}`;
      }

      function normalizeValue(value, field) {
        if (value === "" || value === null || value === undefined) return "";
        let num = Number(value);
        if (!Number.isFinite(num) || num < 0) return "";
        if (field === "reps") num = Math.floor(num);
        return num;
      }

      function normalizeRepsTarget(value) {
        const match = String(value || "").match(/\d+/);
        if (!match) return "";
        return normalizeValue(match[0], "reps");
      }

      function loadTracker(currentBookId, pageIndex) {
        const key = getStorageKey(currentBookId, pageIndex);
        const raw = localStorage.getItem(key);

        if (!raw) {
          return { sets: createDefaultSets() };
        }

        try {
          const parsed = JSON.parse(raw);
          const sets = Array.isArray(parsed.sets) ? parsed.sets : [];

          while (sets.length < 3) {
            sets.push({ kg: "", reps: "", done: false });
          }

          return {
            sets: sets.map((set) => ({
              kg: normalizeValue(set.kg, "kg"),
              reps: normalizeValue(set.reps, "reps"),
              done: Boolean(set.done)
            }))
          };
        } catch {
          return { sets: createDefaultSets() };
        }
      }

      function saveTracker(currentBookId, pageIndex, data) {
        localStorage.setItem(getStorageKey(currentBookId, pageIndex), JSON.stringify(data));
      }

      function loadExerciseTracker(exerciseId, setCount = 3) {
        const raw = localStorage.getItem(getExerciseStorageKey(exerciseId));

        if (!raw) {
          return {
            sets: createDefaultSets(setCount),
            targetSets: setCount,
            targetReps: "",
            rest: 150,
            weight: "",
            history: []
          };
        }

        try {
          const parsed = JSON.parse(raw);
          const sets = Array.isArray(parsed.sets) ? parsed.sets : [];

          while (sets.length < setCount) {
            sets.push({ kg: "", reps: "", done: false });
          }

          return {
            sets: sets.map((set) => ({
              kg: normalizeValue(set.kg, "kg"),
              reps: normalizeValue(set.reps, "reps"),
              done: Boolean(set.done)
            })),
            targetSets: Number(parsed.targetSets) || setCount,
            targetReps: parsed.targetReps || "",
            rest: Number(parsed.rest) || 150,
            weight: normalizeValue(parsed.weight, "kg"),
            history: Array.isArray(parsed.history) ? parsed.history : []
          };
        } catch {
          return {
            sets: createDefaultSets(setCount),
            targetSets: setCount,
            targetReps: "",
            rest: 150,
            weight: "",
            history: []
          };
        }
      }

      function renderBookPages() {
        if (!book) {
          statusEl.textContent = "Book not found.";
          return;
        }

        if (!book.pages.length) {
          bookTitleEl.textContent = book.title;
          statusEl.textContent = "Pages are coming soon.";
          return;
        }

        bookTitleEl.textContent = book.title;
        if (book.id === "hasm" || book.id === "anas" || book.id === "fortyDay" || book.id === "workout" || book.id === "ppl") {
          statusEl.textContent = "";
          pagesEl.innerHTML = "";
          return;
        }

        statusEl.textContent = "Preparing pages…";
        pagesEl.innerHTML = "";

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              const img = entry.target;
              const src = img.dataset.src;
              if (src) {
                img.src = src;
                img.removeAttribute("data-src");
              }
              observer.unobserve(img);
            });
          },
          {
            rootMargin: "600px 0px",
            threshold: 0.01
          }
        );

        const preloadNext = (index) => {
          const next = book.pages[index + 1];
          if (!next) return;
          const img = new Image();
          img.src = next;
        };

        book.pages.forEach((src, index) => {
          const hasTracker = trackerEnabledForPage(book.id, index);

          const wrapper = document.createElement("div");
          wrapper.className = hasTracker ? "page-with-tracker" : "";

          const page = document.createElement("div");
          page.className = "page";

          const img = document.createElement("img");
          img.alt = `Page ${index + 1}`;
          img.loading = "lazy";
          img.dataset.src = src;

          img.addEventListener("load", () => preloadNext(index));

          page.appendChild(img);
          wrapper.appendChild(page);

          if (hasTracker) {
            const tracker = loadTracker(book.id, index);
            wrapper.appendChild(createTrackerElement(book.id, index, tracker));
          }

          pagesEl.appendChild(wrapper);
          observer.observe(img);
        });

        statusEl.textContent = "";
      }

      function parseSessionDate(row) {
        if (row.isoDate) {
          const parsed = new Date(row.isoDate);
          if (!Number.isNaN(parsed.getTime())) return parsed;
        }

        if (row.date) {
          const parsed = new Date(`${row.date}, ${new Date().getFullYear()}`);
          if (!Number.isNaN(parsed.getTime())) return parsed;
        }

        return new Date();
      }

      function filterHistoryRows(rows, range) {
        if (range === "ALL") return rows;

        const daysByRange = {
          W: 7,
          M: 30,
          "3M": 90,
          "6M": 180,
          Y: 365
        };
        const days = daysByRange[range] || 0;
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - days);
        cutoff.setHours(0, 0, 0, 0);

        return rows.filter((row) => parseSessionDate(row) >= cutoff);
      }

      function updateHistoryRange(exerciseId, range) {
        const meta = EXERCISE_META.get(exerciseId);
        if (!meta || !exerciseModalSheet) return;

        const tracker = loadExerciseTracker(exerciseId, meta.targetSets || meta.sets || 3);
        const historyRows = filterHistoryRows(tracker.history || [], range);
        const bestWeight = historyRows.reduce((best, row) => Math.max(best, Number(row.weight) || 0), 0);
        const graphMax = Math.min(500, Math.max(25, Math.ceil((bestWeight || 25) / 25) * 25));
        const chartValues = historyRows.map((row) => Math.max(0, Math.min(500, Number(row.weight) || 0)));
        const chartItems = historyRows.map((row, index) => {
          const weight = Math.max(0, Math.min(500, Number(row.weight) || 0));
          return {
            date: row.date || "-",
            sets: row.sets || "-",
            reps: row.reps || "-",
            weight,
            x: ((index + 1) / historyRows.length) * 100,
            y: 100 - (weight / graphMax) * 100
          };
        });
        const chartPoints = chartValues.length
          ? chartValues.map((weight, index) => {
              const x = ((index + 1) / chartValues.length) * 100;
              const y = 100 - (weight / graphMax) * 100;
              return `${x},${y}`;
            }).join(" ")
          : "";

        const dots = chartValues.map((weight, index) => {
          const x = ((index + 1) / chartValues.length) * 100;
          const y = 100 - (weight / graphMax) * 100;
          return `<span class="history-html-dot" style="left:${x}%; top:${y}%;" title="${weight} kg"></span>`;
        }).join("");

        const totalVolume = historyRows.reduce((sum, row) => {
          const setCount = String(row.sets || "")
            .split(",")
            .map((part) => part.trim())
            .filter(Boolean).length || Number(row.sets) || 0;
          return sum + (Number(row.weight) || 0) * (Number(row.reps) || 0) * setCount;
        }, 0);

        const scale = exerciseModalSheet.querySelector(".history-scale");
        if (scale) {
          scale.innerHTML = `<span>${graphMax}</span><span>${Math.round(graphMax / 2)}</span><span>0</span>`;
        }

        const chart = exerciseModalSheet.querySelector(".history-chart");
        if (chart) {
          chart.setAttribute("preserveAspectRatio", "none");
          chart.innerHTML = `
            <defs>
              <marker id="historyArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
                <path d="M0,0 L7,3.5 L0,7 Z" class="history-arrow" />
              </marker>
            </defs>
            <line x1="0" y1="0" x2="100" y2="0" class="history-gridline" />
            <line x1="0" y1="50" x2="100" y2="50" class="history-gridline" />
            <line x1="0" y1="100" x2="100" y2="100" class="history-axis" />
            <line x1="0" y1="0" x2="0" y2="100" class="history-hover-line" hidden />
            ${chartPoints ? `<polyline points="0,100 ${chartPoints}" class="history-polyline" marker-end="url(#historyArrow)" />` : ""}
          `;
          attachHistoryHover(chart, chartItems);
        }

        const dotLayer = exerciseModalSheet.querySelector(".history-html-dots");
        if (dotLayer) {
          dotLayer.innerHTML = dots;
        }

        const graphLabel = exerciseModalSheet.querySelector(".history-graph > span");
        if (graphLabel) {
          const historyUnitLabel = isHasmBook ? "rounds" : "sessions";
          graphLabel.textContent = historyRows.length ? `${historyRows.length} ${historyUnitLabel} · best ${bestWeight} kg` : `No saved ${historyUnitLabel} yet`;
        }

        const summaryValues = exerciseModalSheet.querySelectorAll(".history-summary b");
        if (summaryValues.length >= 4) {
          const loggedSets = tracker.sets.filter((set) => set.kg !== "" && set.reps !== "");
          summaryValues[0].textContent = historyRows.length;
          summaryValues[1].textContent = `${loggedSets.length}/${tracker.targetSets || meta.targetSets || meta.sets || 3}`;
          summaryValues[2].textContent = bestWeight ? `${bestWeight} kg` : "-";
          summaryValues[3].textContent = totalVolume ? `${Math.round(totalVolume)} kg` : "-";
        }

        const table = exerciseModalSheet.querySelector(".history-table");
        if (table) {
          table.innerHTML = `
            <div class="history-head">
              <span>Date</span><span>${isHasmBook ? "Round" : "Sets"}</span><span>Reps</span><span>Weight</span>
            </div>
            ${
              historyRows.length
                ? historyRows.slice().reverse().map((row) => `
                    <div class="history-row">
                      <span>${row.date || "-"}</span>
                      <span>${row.sets || "-"}</span>
                      <span>${row.reps || "-"}</span>
                      <span>${row.weight ? `${row.weight} kg` : "-"}</span>
                    </div>
                  `).join("")
                : `<div class="history-empty">No ${isHasmBook ? "rounds" : "sessions"} in this range.</div>`
            }
          `;
        }
      }

      function attachHistoryHover(chart, chartItems) {
        const graph = chart.closest(".history-graph");
        const line = chart.querySelector(".history-hover-line");
        const tip = graph?.querySelector(".history-hover-tip");

        if (!graph || !line || !tip || !chartItems.length) return;

        const hideHover = () => {
          line.setAttribute("hidden", "");
          tip.hidden = true;
        };

        chart.addEventListener("mouseleave", hideHover);
        chart.addEventListener("mousemove", (event) => {
          const rect = chart.getBoundingClientRect();
          const mouseX = ((event.clientX - rect.left) / rect.width) * 100;
          const nearest = chartItems.reduce((best, item) => {
            return Math.abs(item.x - mouseX) < Math.abs(best.x - mouseX) ? item : best;
          }, chartItems[0]);

          line.removeAttribute("hidden");
          line.setAttribute("x1", nearest.x);
          line.setAttribute("x2", nearest.x);

          tip.hidden = false;
          tip.innerHTML = `
            <strong>${nearest.date}</strong>
            <span>${isHasmBook ? "Round" : "Sets"}: ${nearest.sets}</span>
            <span>Reps: ${nearest.reps}</span>
            <span>Weight: ${nearest.weight} kg</span>
          `;

          const tipX = Math.min(Math.max((nearest.x / 100) * rect.width, 84), rect.width - 84);
          const tipY = Math.max((nearest.y / 100) * rect.height - 14, 18);
          tip.style.left = `${tipX}px`;
          tip.style.top = `${tipY}px`;
        });
      }

      function logExerciseSession(exerciseId) {
        const meta = EXERCISE_META.get(exerciseId);
        if (!meta) return false;

        const tracker = loadExerciseTracker(exerciseId, meta.targetSets || meta.sets || 3);
        const loggedSets = tracker.sets
          .map((set, index) => ({ ...set, setNumber: index + 1 }))
          .filter((set) => set.kg !== "" && set.reps !== "");
        if (!loggedSets.length) return false;

        const bestSet = loggedSets.reduce((best, set) => {
          const kg = Number(set.kg) || 0;
          const reps = Number(set.reps) || 0;
          if (!best || kg > best.kg || (kg === best.kg && reps > best.reps)) {
            return { kg, reps };
          }
          return best;
        }, null);

        tracker.history = (tracker.history || []).concat({
          date: new Date().toLocaleDateString("en", { month: "short", day: "numeric" }),
          isoDate: new Date().toISOString(),
          sets: loggedSets.map((set) => set.setNumber).join(", "),
          reps: bestSet?.reps || "",
          weight: bestSet?.kg || ""
        });
        tracker.sets = resizeSets([], tracker.targetSets || meta.targetSets || meta.sets || 3);
        saveExerciseTracker(exerciseId, tracker);
        renderExercises(activeMuscle);
        return true;
      }

      if (exerciseImageClose) {
        exerciseImageClose.addEventListener("click", closeExerciseImage);
      }

      if (exerciseImageModal) {
        exerciseImageModal.addEventListener("click", (event) => {
          if (event.target === exerciseImageModal) closeExerciseImage();
        });
      }

      if (exerciseModal) {
        exerciseModal.addEventListener("click", (event) => {
          if (event.target === exerciseModal) closeExerciseModal();
        });
      }

      if (hasmStartBtn) {
        hasmStartBtn.addEventListener("click", startHasmWorkout);
      }

      if (hasmFinishBtn) {
        hasmFinishBtn.addEventListener("click", finishHasmWorkout);
      }

      if (workoutSummaryClose) {
        workoutSummaryClose.addEventListener("click", closeHasmWorkoutSummary);
      }

      if (workoutSummaryShare) {
        workoutSummaryShare.addEventListener("click", shareHasmWorkoutSummary);
      }

      if (workoutSummaryModal) {
        workoutSummaryModal.addEventListener("click", (event) => {
          if (event.target === workoutSummaryModal) closeHasmWorkoutSummary();
        });
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeExerciseImage();
          closeExerciseModal();
          closeHasmWorkoutSummary();
        }
      });

      if (muscleFilter) {
        muscleFilter.addEventListener("click", (event) => {
          const button = event.target.closest(".muscle-btn");
          if (!button) return;

          muscleFilter.querySelectorAll(".muscle-btn").forEach((item) => {
            item.classList.toggle("is-active", item === button);
          });
          renderExercises(button.dataset.muscle);
        });
      }

      window.addEventListener("scroll", () => {
        if (window.scrollY > 400) {
          scrollTopBtn.classList.add("is-visible");
        } else {
          scrollTopBtn.classList.remove("is-visible");
        }
      });

      document.addEventListener(
        "wheel",
        (event) => {
          if (event.target.classList.contains("set-input")) {
            event.target.blur();
          }
        },
        { passive: true }
      );

      document.addEventListener("input", (event) => {
        const target = event.target;
        const exerciseId = target.dataset.exerciseId;

        if (exerciseId && target.dataset.field) {
          const tracker = loadExerciseTracker(exerciseId, getExerciseSetCount(exerciseId));
          const setIndex = Number(target.dataset.setIndex);

          if (!tracker.sets[setIndex]) return;

          tracker.sets[setIndex][target.dataset.field] = normalizeValue(
            target.value,
            target.dataset.field
          );

          saveExerciseTracker(exerciseId, tracker);
          return;
        }

        const targetBookId = target.dataset.bookId;
        const pageIndex = Number(target.dataset.pageIndex);

        if (!targetBookId || Number.isNaN(pageIndex)) return;
        if (!trackerEnabledForPage(targetBookId, pageIndex)) return;
        if (!target.dataset.field) return;

        const tracker = loadTracker(targetBookId, pageIndex);
        const setIndex = Number(target.dataset.setIndex);

        if (!tracker.sets[setIndex]) return;

        tracker.sets[setIndex][target.dataset.field] = normalizeValue(
          target.value,
          target.dataset.field
        );

        saveTracker(targetBookId, pageIndex, tracker);
      });

      document.addEventListener("click", (event) => {
        const btn = event.target.closest("button");
        if (!btn) return;

        if (btn.dataset.role === "modal-close") {
          closeExerciseModal();
          return;
        }

        if (btn.dataset.role === "tune-step") {
          const input = document.getElementById(btn.dataset.target);
          if (!input) return;
          const next = Math.max(Number(input.min) || 1, Math.min(Number(input.max) || 8, Number(input.value || 0) + Number(btn.dataset.delta)));
          input.value = next;
          return;
        }

        if (btn.dataset.role === "tune-rest") {
          const input = document.getElementById("tuneRest");
          const display = document.getElementById("tuneRestDisplay");
          if (!input || !display) return;
          const next = Math.max(0, Math.min(600, Number(input.value || 0) + Number(btn.dataset.delta)));
          input.value = next;
          display.textContent = formatRest(next);
          return;
        }

        if (btn.dataset.role === "open-exercise-image") {
          openExerciseImage(btn.dataset.image, btn.dataset.title);
          return;
        }

        const exerciseId = btn.dataset.exerciseId;

        if (btn.dataset.role === "exercise-history" && exerciseId) {
          openHistoryModal(exerciseId);
          return;
        }

        if (btn.dataset.role === "history-range") {
          const ranges = btn.closest(".history-ranges");
          const rangeExerciseId = ranges?.dataset.exerciseId;
          if (!rangeExerciseId) return;

          ranges.querySelectorAll("button").forEach((item) => {
            item.classList.toggle("is-active", item === btn);
          });
          updateHistoryRange(rangeExerciseId, btn.dataset.range || "ALL");
          return;
        }

        if (btn.dataset.role === "exercise-tune" && exerciseId) {
          openTuneModal(exerciseId);
          return;
        }

        if (btn.dataset.role === "tune-save" && exerciseId) {
          const meta = EXERCISE_META.get(exerciseId);
          if (!meta) return;

          const tracker = loadExerciseTracker(exerciseId, meta.targetSets || meta.sets || 3);
          const targetSets = Math.max(1, Math.min(8, Number(document.getElementById("tuneSets")?.value || tracker.targetSets || 3)));
          const targetReps = document.getElementById("tuneReps")?.value || "";
          const rest = Number(document.getElementById("tuneRest")?.value || tracker.rest || 150);
          const weight = normalizeValue(document.getElementById("tuneWeight")?.value || "", "kg");

          const updatedTracker = {
            ...tracker,
            sets: resizeSets(tracker.sets, targetSets).map((set) => ({
              ...set,
              kg: weight,
              reps: normalizeRepsTarget(targetReps)
            })),
            targetSets,
            targetReps,
            rest,
            weight
          };

          saveExerciseTracker(exerciseId, updatedTracker);
          closeExerciseModal();
          renderExercises(activeMuscle);
          return;
        }

        if (btn.dataset.role === "history-log-session" && exerciseId) {
          if (logExerciseSession(exerciseId)) openHistoryModal(exerciseId);
          return;
        }

        if (btn.dataset.role === "hasm-set-done" && exerciseId) {
          toggleHasmSetDone(exerciseId, Number(btn.dataset.setIndex));
          return;
        }

        if (btn.dataset.role === "exercise-log-session" && exerciseId) {
          logExerciseSession(exerciseId);
          return;
        }

        if (exerciseId) {
          const tracker = loadExerciseTracker(exerciseId, getExerciseSetCount(exerciseId));

          const wrapper = btn.closest(".exercise-workout-card");
          if (!wrapper) return;

          if (btn.dataset.role === "exercise-add-set") {
            tracker.sets.push({
              kg: "",
              reps: "",
              done: false
            });
            saveExerciseTracker(exerciseId, tracker);
            replaceExerciseTrackerBox(wrapper, exerciseId, tracker, tracker.sets.length);
            return;
          }

          if (btn.dataset.role === "exercise-reset-tracker") {
            const setCount = Number(btn.dataset.defaultSets) || 3;
            if (isHasmBook) {
              const session = getActiveHasmSession();
              if (session) {
                tracker.history = (tracker.history || []).filter((row) => String(row.hasmSessionId || "") !== String(session.startedAt));
                if (session.exerciseRecords) delete session.exerciseRecords[exerciseId];
                if (session.completedExercises) delete session.completedExercises[exerciseId];
                localStorage.setItem(HASM_ACTIVE_SESSION_KEY, JSON.stringify(session));
              }
            }
            const resetData = {
              ...tracker,
              sets: createDefaultSets(setCount),
              targetSets: setCount
            };
            saveExerciseTracker(exerciseId, resetData);
            replaceExerciseTrackerBox(wrapper, exerciseId, resetData, setCount);
            return;
          }
        }

        const targetBookId = btn.dataset.bookId;
        const pageIndex = Number(btn.dataset.pageIndex);

        if (!targetBookId || Number.isNaN(pageIndex)) return;
        if (!trackerEnabledForPage(targetBookId, pageIndex)) return;

        const tracker = loadTracker(targetBookId, pageIndex);

        if (btn.dataset.role === "done") {
          const setIndex = Number(btn.dataset.setIndex);
          if (!tracker.sets[setIndex]) return;

          tracker.sets[setIndex].done = !tracker.sets[setIndex].done;
          saveTracker(targetBookId, pageIndex, tracker);
          btn.classList.toggle("active", tracker.sets[setIndex].done);
          return;
        }

        const wrapper = btn.closest(".page-with-tracker");
        if (!wrapper) return;

        if (btn.dataset.role === "add-set") {
          tracker.sets.push({
            kg: "",
            reps: "",
            done: false
          });
          saveTracker(targetBookId, pageIndex, tracker);
          replaceTrackerBox(wrapper, targetBookId, pageIndex, tracker);
          return;
        }

        if (btn.dataset.role === "reset-tracker") {
          const resetData = { sets: createDefaultSets() };
          saveTracker(targetBookId, pageIndex, resetData);
          replaceTrackerBox(wrapper, targetBookId, pageIndex, resetData);
        }
      });

      setupWorkoutExercises();
      renderBookPages();

      // إخفاء شاشة التحميل الذكية فور اكتمال بناء التمارين والصفحات
      (function() {
        var catBox = document.getElementById('splash-cat-box');
        var splash = document.getElementById('neon-app-splash');
        if (!splash) return;

        window.dismissNeonSplash = function() {
          if (catBox) catBox.classList.add('is-loaded');
          setTimeout(function() {
            splash.classList.add('splash-hide');
            setTimeout(function() {
              splash.remove();
            }, 460);
          }, 380);
        };

        // إخفاء بعد انتهاء دورة الأنيميشن السريعة لضمان سلاسة الانتقال
        setTimeout(function() {
          window.dismissNeonSplash();
        }, 500);
      })();

      // تشغيل خلفية النقاط والجسيمات النيونية الخضراء الطائرة
      (function initBackgroundParticles() {
        var canvas = document.getElementById('neon-particles-canvas');
        if (!canvas) {
          canvas = document.createElement('canvas');
          canvas.id = 'neon-particles-canvas';
          canvas.style.cssText = 'position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; opacity: 0.92;';
          document.body.insertBefore(canvas, document.body.firstChild);
        }
        var ctx = canvas.getContext('2d');
        if (!ctx) return;
        var width = 0, height = 0;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.scale(dpr, dpr);
        }
        resize();
        window.addEventListener('resize', resize, { passive: true });
        var count = Math.max(40, Math.min(85, Math.floor(width / 16)));
        var particles = [];
        for (var i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2.2 + 0.9,
            baseAlpha: Math.random() * 0.45 + 0.35,
            alpha: 0.5,
            pulseSpeed: Math.random() * 0.025 + 0.012,
            pulseVal: Math.random() * Math.PI * 2,
            vx: (Math.random() - 0.5) * 0.45,
            vy: -(Math.random() * 0.65 + 0.3),
            glow: Math.random() * 10 + 5
          });
        }
        var isRunning = true;
        function render() {
          if (!isRunning) return;
          ctx.clearRect(0, 0, width, height);
          for (var j = 0; j < particles.length; j++) {
            var p = particles[j];
            p.y += p.vy;
            p.x += p.vx;
            p.pulseVal += p.pulseSpeed;
            p.alpha = p.baseAlpha + Math.sin(p.pulseVal) * 0.28;
            var a = Math.max(0.12, Math.min(0.95, p.alpha));
            if (p.y < -15) { p.y = height + 15; p.x = Math.random() * width; }
            if (p.x < -15) p.x = width + 15;
            if (p.x > width + 15) p.x = -15;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.shadowBlur = p.glow;
            ctx.shadowColor = '#55F7A5';
            ctx.fillStyle = 'rgba(85, 247, 165, ' + a.toFixed(3) + ')';
            ctx.fill();
          }
          requestAnimationFrame(render);
        }
        render();
        document.addEventListener('visibilitychange', function() {
          if (document.hidden) { isRunning = false; }
          else if (!isRunning) { isRunning = true; render(); }
        });
      })();
    </script>
